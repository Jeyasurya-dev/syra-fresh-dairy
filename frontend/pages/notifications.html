<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — SYRA Fresh</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/pages.css">
<style>
    .notif-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-5); flex-wrap: wrap; gap: 10px; }
    .notif-filters { display: flex; gap: 10px; margin-bottom: var(--space-4); flex-wrap: wrap; }
    .filter-btn { padding: 8px 16px; border: 1.5px solid var(--color-border); background: transparent; color: var(--color-ink); border-radius: 100px; cursor: pointer; font-size: var(--fs-sm); transition: all 0.2s ease; }
    .filter-btn.active { background: var(--color-forest); color: #fff; border-color: var(--color-forest); }
    .notification-card { background: var(--color-surface); padding: var(--space-4); border-radius: var(--radius-md); margin-bottom: 12px; border-left: 4px solid var(--color-forest); border-top: 1px solid var(--color-border); border-right: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; transition: box-shadow 0.2s ease; }
    .notification-card:hover { box-shadow: var(--shadow-sm); }
    .notification-card.unread { background: var(--color-leaf-light); }
    .notification-content { flex: 1; }
    .notification-title { font-weight: 600; color: var(--color-ink); margin-bottom: 6px; }
    .notification-message { color: var(--color-ink-soft); font-size: var(--fs-sm); margin-bottom: 6px; }
    .notification-time { font-size: var(--fs-xs); color: var(--color-ink-soft); }
    .notification-action { display: flex; gap: 10px; align-items: center; }
    .unread-indicator { width: 10px; height: 10px; border-radius: 50%; background: var(--color-forest); flex-shrink: 0; }
    .btn-delete { padding: 6px 12px; background: transparent; color: var(--color-berry); border: 1.5px solid var(--color-berry); border-radius: var(--radius-sm); cursor: pointer; font-size: var(--fs-xs); font-weight: 600; }
    .pagination { display: flex; gap: 8px; justify-content: center; margin-top: var(--space-5); flex-wrap: wrap; }
    .pagination button { padding: 8px 12px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-ink); border-radius: var(--radius-sm); cursor: pointer; }
    .pagination button.active { background: var(--color-forest); color: #fff; border-color: var(--color-forest); }
</style>
</head>
<body>

<div id="site-header-root"></div>

<main class="container section">
  <div class="breadcrumb"><a href="/index.html">Home</a><span>/</span><span aria-current="page">Notifications</span></div>

  <div class="notif-header">
    <h1 class="section-title">🔔 Notifications</h1>
    <div class="notif-filters" style="margin:0">
      <button onclick="markAllRead()" class="btn btn-outline btn-sm">Mark All as Read</button>
    </div>
  </div>

  <div class="notif-filters">
    <button class="filter-btn active" onclick="filterByStatus('all', this)">All</button>
    <button class="filter-btn" onclick="filterByStatus('unread', this)">Unread</button>
    <button class="filter-btn" onclick="filterByStatus('read', this)">Read</button>
  </div>

  <div id="notificationsContainer"><div class="skeleton" style="height:300px"></div></div>

  <div class="pagination" id="pagination"></div>
</main>

<div id="site-footer-root"></div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentPage = 1;
let currentStatus = 'all';
const limit = 10;

async function loadNotifications(page = 1, status = 'all') {
    if (!Auth.requireLogin('/pages/login.html')) return;

    try {
        const params = new URLSearchParams({ page, limit });
        if (status === 'unread') params.set('unread_only', 'true');
        const data = await Api.get(`/notifications?${params.toString()}`, true);

        let notifications = data.notifications || [];
        if (status === 'read') notifications = notifications.filter(n => n.read);

        renderNotifications(notifications);
        renderPagination(data.pagination || {}, status);
        currentPage = page;
        currentStatus = status;
    } catch (e) {
        document.getElementById('notificationsContainer').innerHTML =
            `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
    }
}

function renderNotifications(notifications) {
    const container = document.getElementById('notificationsContainer');

    if (!notifications || notifications.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🔔</div><p>No notifications</p></div>';
        return;
    }

    container.innerHTML = notifications.map(notification => {
        const unreadClass = !notification.read ? 'unread' : '';
        const time = notification.created_at ? new Date(notification.created_at).toLocaleString('en-IN', {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '';
        const message = notification.data ? JSON.stringify(notification.data).substring(0, 100) : '';

        return `
            <div class="notification-card ${unreadClass}" onclick="markAsRead('${notification.id}')">
                <div class="notification-content">
                    <div class="notification-title">${notification.title || 'Notification'}</div>
                    <div class="notification-message">${message}</div>
                    <div class="notification-time">${time}</div>
                </div>
                <div class="notification-action">
                    ${!notification.read ? '<div class="unread-indicator"></div>' : ''}
                    <button class="btn-delete" onclick="event.stopPropagation(); deleteNotification('${notification.id}')">Delete</button>
                </div>
            </div>
        `;
    }).join('');
}

function renderPagination(pagination, status) {
    const container = document.getElementById('pagination');
    const totalPages = Math.ceil((pagination.total || 0) / (pagination.limit || limit)) || 1;
    let html = '';
    for (let i = 1; i <= totalPages; i++) {
        html += `<button onclick="loadNotifications(${i}, '${status}')" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
    }
    container.innerHTML = html;
}

function filterByStatus(status, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadNotifications(1, status);
}

async function markAsRead(notificationId) {
    try {
        await Api.put(`/notifications/${notificationId}/read`, {}, true);
        loadNotifications(currentPage, currentStatus);
    } catch (e) {
        showToast(e.message);
    }
}

async function markAllRead() {
    try {
        await Api.post('/notifications/mark-all-read', {}, true);
        showToast('All notifications marked as read');
        loadNotifications(1, currentStatus);
    } catch (e) {
        showToast(e.message);
    }
}

async function deleteNotification(notificationId) {
    try {
        await Api.del(`/notifications/${notificationId}`, true);
        showToast('Notification deleted');
        loadNotifications(currentPage, currentStatus);
    } catch (e) {
        showToast(e.message);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    initLayout('');
    loadNotifications();
});
</script>
</body>
</html>
