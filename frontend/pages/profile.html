<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — SYRA Fresh</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<meta name="description" content="Manage your SYRA Fresh account, saved addresses and preferences.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<div id="site-header-root"></div>

<main class="container section">
  <div class="breadcrumb"><a href="/index.html">Home</a><span>/</span><span aria-current="page">My Account</span></div>
  <div class="page-header"><h1>My Account</h1></div>

  <div id="profile-root">
    <div class="skeleton" style="height:400px"></div>
  </div>
</main>

<div id="site-footer-root"></div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/pages.js"></script>
<script>
let editingAddressId = null;

function shellHTML(user) {
  const initials = (user.name || '?').split(' ').map((s) => s[0]).slice(0, 2).join('').toUpperCase();
  return `
    <div class="profile-layout">
      <aside class="profile-card">
        <div class="profile-avatar">${initials}</div>
        <p class="text-center" style="font-weight:700">${user.name}</p>
        <p class="text-center" style="font-size:var(--fs-xs); color:var(--color-ink-soft)">${user.email}</p>
        <nav class="profile-nav">
          <button class="active" data-tab="details" onclick="switchTabGroup('.profile-nav button','.profile-panel','details')">👤 Account Details</button>
          <button data-tab="addresses" onclick="switchTabGroup('.profile-nav button','.profile-panel','addresses')">📍 Saved Addresses</button>
          <button data-tab="orders" onclick="window.location.href='/pages/orders.html'">📦 My Orders</button>
          <button data-tab="wishlist" onclick="window.location.href='/pages/wishlist.html'">💚 Wishlist</button>
          <button class="danger" onclick="Auth.logout()">🚪 Log Out</button>
        </nav>
      </aside>

      <div>
        <section class="profile-panel active" data-panel="details">
          <div class="checkout-card" style="background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding: var(--space-5)">
            <h3 style="font-family:var(--font-display); margin-bottom:var(--space-4)">Account Details</h3>
            <form id="details-form">
              <div class="form-row">
                <div class="form-group"><label>Full Name</label><input id="pf-name" value="${user.name || ''}" required></div>
                <div class="form-group"><label>Phone</label><input id="pf-phone" value="${user.phone || ''}" placeholder="10-digit mobile number"></div>
              </div>
              <div class="form-group"><label>Email</label><input value="${user.email || ''}" disabled style="opacity:0.6"></div>
              <div id="details-error" class="form-error"></div>
              <button class="btn btn-primary" type="submit">Save Changes</button>
            </form>
            <p style="font-size:var(--fs-xs); color:var(--color-ink-soft); margin-top:var(--space-4)">
              Member since ${formatDate(user.created_at)}
            </p>
          </div>
        </section>

        <section class="profile-panel" data-panel="addresses">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-4)">
            <h3 style="font-family:var(--font-display)">Saved Addresses</h3>
            <button class="btn btn-primary btn-sm" onclick="openAddressForm()">+ Add Address</button>
          </div>
          <div id="address-list"></div>
          <div id="address-form-card" class="checkout-card" style="display:none; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding: var(--space-5); margin-top: var(--space-4)">
            <h4 id="address-form-title" style="margin-bottom:var(--space-3)">Add New Address</h4>
            <form id="address-form">
              <div class="form-row">
                <div class="form-group"><label>Label</label>
                  <select id="af-label"><option>Home</option><option>Work</option><option>Other</option></select>
                </div>
                <div class="form-group"><label>Full Name</label><input id="af-name" required></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Phone</label><input id="af-phone" required></div>
                <div class="form-group"><label>Pincode</label><input id="af-pincode" required></div>
              </div>
              <div class="form-group"><label>Address Line 1</label><input id="af-line1" required></div>
              <div class="form-group"><label>Address Line 2 (optional)</label><input id="af-line2"></div>
              <div class="form-row">
                <div class="form-group"><label>City</label><input id="af-city" required></div>
                <div class="form-group"><label>State</label><input id="af-state" required></div>
              </div>
              <div class="form-group"><label style="display:flex; align-items:center; gap:8px; cursor:pointer"><input type="checkbox" id="af-default" style="width:auto"> Set as default address</label></div>
              <div id="address-error" class="form-error"></div>
              <div style="display:flex; gap:10px">
                <button class="btn btn-primary" type="submit">Save Address</button>
                <button class="btn btn-outline" type="button" onclick="closeAddressForm()">Cancel</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>`;
}

function addressCardHTML(a) {
  return `
    <div class="address-card">
      ${a.is_default ? '<span class="default-badge">Default</span>' : ''}
      <strong>${a.label}</strong>
      <p style="margin-top:4px">${a.full_name} · ${a.phone}</p>
      <p style="color:var(--color-ink-soft); font-size:var(--fs-sm)">${a.line1}${a.line2 ? ', ' + a.line2 : ''}, ${a.city}, ${a.state} - ${a.pincode}</p>
      <div class="address-card-actions">
        <button onclick='editAddress(${JSON.stringify(a).replace(/'/g, "&apos;")})'>Edit</button>
        <button class="danger" onclick="deleteAddress('${a._id}')">Delete</button>
      </div>
    </div>`;
}

async function loadProfile() {
  const root = document.getElementById('profile-root');
  if (!Auth.requireLogin('/pages/login.html')) return;
  try {
    const data = await Api.get('/auth/me', true);
    root.innerHTML = shellHTML(data.user);
    renderAddresses(data.user.addresses || []);

    document.getElementById('details-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('details-error');
      errEl.textContent = '';
      try {
        const res = await Api.put('/auth/me', { name: document.getElementById('pf-name').value.trim(), phone: document.getElementById('pf-phone').value.trim() }, true);
        localStorage.setItem('syra_user', JSON.stringify(res.user));
        showToast('Profile updated');
      } catch (err) { errEl.textContent = err.message; }
    });

    document.getElementById('address-form').addEventListener('submit', saveAddress);
  } catch (e) {
    root.innerHTML = `<div class="empty-state"><p>${e.message}</p></div>`;
  }
}

function renderAddresses(addresses) {
  const el = document.getElementById('address-list');
  el.innerHTML = addresses.length
    ? addresses.map(addressCardHTML).join('')
    : `<p style="color:var(--color-ink-soft)">No saved addresses yet. Add one for faster checkout.</p>`;
}

function openAddressForm() {
  editingAddressId = null;
  document.getElementById('address-form-title').textContent = 'Add New Address';
  document.getElementById('address-form').reset();
  document.getElementById('address-form-card').style.display = 'block';
}
function closeAddressForm() { document.getElementById('address-form-card').style.display = 'none'; }

function editAddress(a) {
  editingAddressId = a._id;
  document.getElementById('address-form-title').textContent = 'Edit Address';
  document.getElementById('af-label').value = a.label;
  document.getElementById('af-name').value = a.full_name;
  document.getElementById('af-phone').value = a.phone;
  document.getElementById('af-pincode').value = a.pincode;
  document.getElementById('af-line1').value = a.line1;
  document.getElementById('af-line2').value = a.line2 || '';
  document.getElementById('af-city').value = a.city;
  document.getElementById('af-state').value = a.state;
  document.getElementById('af-default').checked = !!a.is_default;
  document.getElementById('address-form-card').style.display = 'block';
  document.getElementById('address-form-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function saveAddress(e) {
  e.preventDefault();
  const errEl = document.getElementById('address-error');
  errEl.textContent = '';
  const payload = {
    label: document.getElementById('af-label').value,
    full_name: document.getElementById('af-name').value.trim(),
    phone: document.getElementById('af-phone').value.trim(),
    line1: document.getElementById('af-line1').value.trim(),
    line2: document.getElementById('af-line2').value.trim(),
    city: document.getElementById('af-city').value.trim(),
    state: document.getElementById('af-state').value.trim(),
    pincode: document.getElementById('af-pincode').value.trim(),
    is_default: document.getElementById('af-default').checked,
  };
  try {
    if (editingAddressId) {
      await Api.put(`/auth/addresses/${editingAddressId}`, payload, true);
    } else {
      await Api.post('/auth/addresses', payload, true);
    }
    showToast('Address saved');
    closeAddressForm();
    const data = await Api.get('/auth/me', true);
    renderAddresses(data.user.addresses || []);
  } catch (err) { errEl.textContent = err.message; }
}

async function deleteAddress(id) {
  try {
    await Api.del(`/auth/addresses/${id}`, true);
    showToast('Address removed');
    const data = await Api.get('/auth/me', true);
    renderAddresses(data.user.addresses || []);
  } catch (e) { showToast(e.message); }
}

document.addEventListener('DOMContentLoaded', () => {
  initLayout('');
  loadProfile();
});
</script>
</body>
</html>
