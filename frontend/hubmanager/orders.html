<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — SYRA Hub Manager</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../admin/css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside id="admin-sidebar"></aside>
  <div class="admin-content">
    <header id="admin-topbar"></header>
    <main class="admin-main">

      <div class="admin-toolbar">
        <select id="status-filter" onchange="loadOrders(1)" style="max-width:200px">
          <option value="">All Statuses</option>
          <option value="Placed">Placed</option>
          <option value="Packed">Packed</option>
          <option value="Out for Delivery">Out for Delivery</option>
          <option value="Delivered">Delivered</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Order #</th><th>Customer Address</th><th>Total</th><th>Status</th><th>Delivery Boy</th><th>Placed</th><th>Actions</th></tr></thead>
          <tbody id="orders-body"><tr><td colspan="7"><div class="skeleton" style="height:20px"></div></td></tr></tbody>
        </table>
      </div>

      <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;" id="pagination"></div>

    </main>
  </div>
</div>

<div class="modal-overlay" id="assign-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Assign Order to a Delivery Boy</h3>
      <button class="modal-close" onclick="hmCloseModal('assign-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Delivery Boy (your hub only)</label>
        <select id="assign-delivery-boy"></select>
      </div>
      <div id="assign-error" class="form-error"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-outline" onclick="hmCloseModal('assign-modal')">Cancel</button>
      <button type="button" class="btn btn-primary" onclick="submitAssign()">Assign</button>
    </div>
  </div>
</div>

<script src="js/hubmanager-api.js"></script>
<script src="js/hubmanager.js"></script>
<script>
let currentPage = 1;
let assigningOrderId = null;
let hubBoysCache = [];

function orderRowHTML(o) {
  const addr = o.address || {};
  return `
    <tr>
      <td><strong>#${o.order_number}</strong></td>
      <td>${hmEscapeHTML(addr.city || '')}, ${hmEscapeHTML(addr.pincode || '')}</td>
      <td>₹${(o.totals?.total || 0).toFixed(2)}</td>
      <td>${hmStatusBadgeHTML(o.status)}</td>
      <td>${o.delivery_boy_name || '<span style="opacity:.6">Unassigned</span>'}</td>
      <td>${hmFormatDateTime(o.created_at)}</td>
      <td>
        ${!o.delivery_boy_id && o.status !== 'Cancelled' ? `<button class="btn btn-sm btn-primary" onclick="openAssignModal('${o.id}')">Assign</button>` : '—'}
      </td>
    </tr>`;
}

async function loadOrders(page = 1) {
  currentPage = page;
  const status = document.getElementById('status-filter').value;
  const body = document.getElementById('orders-body');
  try {
    let url = `/hub-manager/orders?page=${page}&limit=10`;
    if (status) url += `&status=${encodeURIComponent(status)}`;
    const data = await HubManagerApi.get(url);
    const orders = data.orders || [];
    body.innerHTML = orders.length ? orders.map(orderRowHTML).join('') : `<tr><td colspan="7"><div class="empty-state">No orders for your hub yet.</div></td></tr>`;
    body.classList.add('fade-in');
    renderPagination(data.pagination || {});
  } catch (e) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty-state">${e.message}</div></td></tr>`;
  }
}

function renderPagination(p) {
  const container = document.getElementById('pagination');
  if (!p.pages || p.pages <= 1) { container.innerHTML = ''; return; }
  let html = '';
  for (let i = 1; i <= p.pages; i++) {
    html += `<button onclick="loadOrders(${i})" style="${i === currentPage ? 'background: var(--color-forest); color: white;' : ''} padding: 8px 12px; border: 1px solid var(--color-border); cursor: pointer;">${i}</button>`;
  }
  container.innerHTML = html;
}

async function openAssignModal(orderId) {
  assigningOrderId = orderId;
  document.getElementById('assign-error').textContent = '';
  const select = document.getElementById('assign-delivery-boy');
  select.innerHTML = '<option value="">Loading...</option>';
  hmOpenModal('assign-modal');
  try {
    const data = await HubManagerApi.get('/hub-manager/delivery-boys?status=approved');
    hubBoysCache = data.delivery_boys || [];
    select.innerHTML = hubBoysCache.length
      ? hubBoysCache.map((b) => `<option value="${b.id}">${hmEscapeHTML(b.name)} — ${hmEscapeHTML(b.delivery_area || '')}</option>`).join('')
      : '<option value="">No approved delivery boys in your hub yet</option>';
  } catch (e) {
    select.innerHTML = `<option value="">${e.message}</option>`;
  }
}

async function submitAssign() {
  const deliveryBoyId = document.getElementById('assign-delivery-boy').value;
  const errEl = document.getElementById('assign-error');
  if (!deliveryBoyId) { errEl.textContent = 'Select a delivery boy'; return; }
  try {
    await HubManagerApi.post(`/hub-manager/orders/${assigningOrderId}/assign`, { delivery_boy_id: deliveryBoyId });
    hmToast('Order assigned');
    hmCloseModal('assign-modal');
    loadOrders(currentPage);
  } catch (e) {
    errEl.textContent = e.message;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (initHubManagerShell('orders')) loadOrders();
});
</script>
</body>
</html>
