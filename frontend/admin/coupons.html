<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupons — SYRA Admin</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside id="admin-sidebar"></aside>
  <div class="admin-content">
    <header id="admin-topbar"></header>
    <main class="admin-main">

      <div class="admin-toolbar">
        <div style="flex:1"></div>
        <button class="btn btn-primary" onclick="openCouponForm()">+ Create Coupon</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Code</th><th>Discount</th><th>Min Order</th><th>Max Discount</th><th>Expires</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="coupons-body"><tr><td colspan="7"><div class="skeleton" style="height:20px"></div></td></tr></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<div class="modal-overlay" id="coupon-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Create Coupon</h3>
      <button class="modal-close" onclick="closeModal('coupon-modal')">✕</button>
    </div>
    <form id="coupon-form">
      <div class="modal-body">
        <div class="form-group"><label>Coupon Code</label><input id="cp-code" placeholder="FRESH50" style="text-transform:uppercase" required></div>
        <div class="form-row">
          <div class="form-group"><label>Discount Type</label>
            <select id="cp-type"><option value="percent">Percentage (%)</option><option value="flat">Flat Amount (₹)</option></select>
          </div>
          <div class="form-group"><label>Value</label><input type="number" step="0.01" id="cp-value" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Minimum Order Value (₹)</label><input type="number" step="0.01" id="cp-min" value="0"></div>
          <div class="form-group"><label>Max Discount Cap (₹, optional)</label><input type="number" step="0.01" id="cp-max-discount" placeholder="No cap"></div>
        </div>
        <div class="form-group"><label>Expiry Date (optional)</label><input type="date" id="cp-expires"></div>
        <div id="coupon-error" class="form-error"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal('coupon-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Coupon</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin-api.js"></script>
<script src="js/admin.js"></script>
<script>
function couponRowHTML(c) {
  const discount = c.discount_type === 'percent' ? `${c.value}% OFF` : `₹${c.value} OFF`;
  const expired = c.expires_at && new Date(c.expires_at) < new Date();
  return `
    <tr>
      <td><code style="font-weight:700; background:var(--color-surface-alt); padding:3px 9px; border-radius:6px">${c.code}</code></td>
      <td>${discount}</td>
      <td>₹${c.min_order_value || 0}</td>
      <td>${c.max_discount ? '₹' + c.max_discount : '—'}</td>
      <td>${c.expires_at ? formatDate(c.expires_at) : 'Never'}</td>
      <td>
        <label class="switch"><input type="checkbox" ${c.is_active && !expired ? 'checked' : ''} ${expired ? 'disabled' : ''} onchange="toggleCoupon('${c.id}', this.checked)"><span class="slider"></span></label>
        ${expired ? `<span style="font-size:11px; color:var(--color-berry); margin-left:6px">Expired</span>` : ''}
      </td>
      <td><button class="btn-icon danger" title="Delete" onclick="deleteCoupon('${c.id}')">🗑️</button></td>
    </tr>`;
}

async function loadCoupons() {
  const body = document.getElementById('coupons-body');
  try {
    const data = await AdminApi.get('/admin/coupons');
    body.innerHTML = data.coupons.length ? data.coupons.map(couponRowHTML).join('') : `<tr><td colspan="7"><div class="empty-state">No coupons yet. Create one to get started.</div></td></tr>`;
  } catch (e) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty-state">${e.message}</div></td></tr>`;
  }
}

function openCouponForm() {
  document.getElementById('coupon-form').reset();
  document.getElementById('coupon-error').textContent = '';
  openModal('coupon-modal');
}

document.getElementById('coupon-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('coupon-error');
  errEl.textContent = '';
  const payload = {
    code: document.getElementById('cp-code').value.trim().toUpperCase(),
    discount_type: document.getElementById('cp-type').value,
    value: parseFloat(document.getElementById('cp-value').value),
    min_order_value: parseFloat(document.getElementById('cp-min').value) || 0,
    max_discount: document.getElementById('cp-max-discount').value ? parseFloat(document.getElementById('cp-max-discount').value) : null,
    expires_at: document.getElementById('cp-expires').value ? new Date(document.getElementById('cp-expires').value).toISOString() : null,
  };
  try {
    await AdminApi.post('/admin/coupons', payload);
    adminToast('Coupon created');
    closeModal('coupon-modal');
    loadCoupons();
  } catch (err) { errEl.textContent = err.message; }
});

async function toggleCoupon(id, isActive) {
  try {
    await AdminApi.put(`/admin/coupons/${id}`, { is_active: isActive });
    adminToast(isActive ? 'Coupon activated' : 'Coupon deactivated');
  } catch (e) { adminToast(e.message); loadCoupons(); }
}

async function deleteCoupon(id) {
  if (!confirm('Delete this coupon?')) return;
  try {
    await AdminApi.del(`/admin/coupons/${id}`);
    adminToast('Coupon deleted');
    loadCoupons();
  } catch (e) { adminToast(e.message); }
}

document.addEventListener('DOMContentLoaded', () => {
  if (initAdminShell('coupons')) loadCoupons();
});
</script>
</body>
</html>
