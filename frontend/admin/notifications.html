<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — SYRA Admin</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="css/admin.css">
<style>
.filters { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
.filter-select { padding:8px 12px; border:1px solid var(--color-border); border-radius:6px; background:var(--color-bg); color:var(--color-ink); font-size:14px; }
.notif-card { background:var(--color-bg); border:1px solid var(--color-border); border-radius:8px; padding:16px 20px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:start; gap:16px; cursor:pointer; transition:box-shadow .2s; border-left:4px solid var(--color-forest); }
.notif-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.1); }
.notif-card.unread { background:#f0f8ff; font-weight:500; border-left-color:#0066cc; }
.notif-title { font-weight:600; font-size:14px; color:var(--color-ink); margin-bottom:6px; }
.notif-body { font-size:13px; color:var(--color-ink-soft); margin-bottom:6px; }
.notif-time { font-size:12px; color:var(--color-ink-soft); }
.unread-dot { width:10px; height:10px; border-radius:50%; background:var(--color-forest); flex-shrink:0; margin-top:4px; }
.stat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:24px; }
.stat-mini { background:var(--color-bg); border:1px solid var(--color-border); border-radius:8px; padding:16px; text-align:center; }
.stat-mini .n { font-size:28px; font-weight:700; color:var(--color-ink); }
.stat-mini .l { font-size:12px; color:var(--color-ink-soft); text-transform:uppercase; margin-top:4px; }
.empty-state { text-align:center; padding:60px 20px; color:var(--color-ink-soft); }
</style>
</head>
<body>
<div class="admin-layout">
  <aside id="admin-sidebar"></aside>
  <div class="admin-content">
    <header id="admin-topbar"></header>
    <main class="admin-main">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <h1>🔔 Notifications</h1>
        <button class="btn btn-outline" onclick="markAllRead()">Mark All Read</button>
      </div>

      <div class="stat-row">
        <div class="stat-mini"><div class="n" id="statTotal">—</div><div class="l">Total</div></div>
        <div class="stat-mini"><div class="n" id="statUnread">—</div><div class="l">Unread</div></div>
        <div class="stat-mini"><div class="n" id="statToday">—</div><div class="l">Today</div></div>
      </div>

      <div class="card">
        <div class="filters">
          <select class="filter-select" id="typeFilter" onchange="loadNotifications(1)">
            <option value="">All Types</option>
            <option value="admin_new_registration">New Registrations</option>
            <option value="admin_new_order">New Orders</option>
            <option value="admin_failed_delivery">Failed Deliveries</option>
          </select>
          <select class="filter-select" id="readFilter" onchange="loadNotifications(1)">
            <option value="">All</option>
            <option value="unread">Unread</option>
            <option value="read">Read</option>
          </select>
        </div>
        <div id="notificationsContainer">
          <div class="empty-state">Loading...</div>
        </div>
      </div>

      <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;" id="pagination"></div>

    </main>
  </div>
</div>

<script src="js/admin-api.js"></script>
<script src="js/admin.js"></script>
<script>
let currentPage = 1;

async function loadNotifications(page = 1) {
  currentPage = page;
  const readFilter = document.getElementById("readFilter").value;
  let url = `/notifications/admin?page=${page}&limit=20`;
  if (readFilter === "unread") url += "&unread_only=true";

  try {
    const data = await AdminApi.get(url);
    renderNotifications(data.notifications || []);
    renderPagination(data.pagination || {});
    document.getElementById("statTotal").textContent = data.pagination?.total || 0;
    document.getElementById("statUnread").textContent = data.unread_count || 0;

    // Count today
    const today = (data.notifications || []).filter(n => {
      const d = new Date(n.created_at);
      const now = new Date();
      return d.toDateString() === now.toDateString();
    }).length;
    document.getElementById("statToday").textContent = today;
  } catch (e) {
    document.getElementById("notificationsContainer").innerHTML =
      `<div class="empty-state" style="color:#dc3545">Error loading notifications</div>`;
  }
}

function getTypeIcon(type) {
  const icons = {
    admin_new_registration: "🆕",
    admin_new_order: "🛒",
    admin_failed_delivery: "❌",
    order_placed: "📦",
    order_delivered: "✅",
    delivery_boy_assigned: "🚚"
  };
  return icons[type] || "🔔";
}

function renderNotifications(notifications) {
  const container = document.getElementById("notificationsContainer");
  if (!notifications.length) {
    container.innerHTML = `<div class="empty-state">No notifications found</div>`;
    return;
  }
  container.innerHTML = notifications.map(n => {
    const time = new Date(n.created_at).toLocaleString("en-IN", {
      month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
    });
    const dataStr = n.data ? Object.entries(n.data)
      .map(([k, v]) => `${k.replace(/_/g," ")}: ${v}`)
      .join(" · ") : "";
    return `
      <div class="notif-card ${n.read ? "" : "unread"}" onclick="markRead('${n.id}', this)">
        <div style="flex:1">
          <div class="notif-title">${getTypeIcon(n.type)} ${n.title || n.type}</div>
          <div class="notif-body">${dataStr}</div>
          <div class="notif-time">${time}</div>
        </div>
        ${!n.read ? '<div class="unread-dot"></div>' : ''}
      </div>
    `;
  }).join("");
}

function renderPagination(p) {
  const container = document.getElementById("pagination");
  const totalPages = Math.ceil((p.total || 0) / (p.limit || 20));
  if (totalPages <= 1) { container.innerHTML = ""; return; }
  container.innerHTML = Array.from({length: totalPages}, (_, i) => i + 1).map(i =>
    `<button onclick="loadNotifications(${i})" style="padding:6px 12px;border:1px solid var(--color-border);cursor:pointer;border-radius:4px;background:${i===currentPage?'var(--color-forest)':'var(--color-bg)'};color:${i===currentPage?'white':'var(--color-ink)'}">${i}</button>`
  ).join("");
}

async function markRead(id, el) {
  try {
    await AdminApi.put(`/notifications/${id}/read`, {});
    el.classList.remove("unread");
    el.querySelector(".unread-dot")?.remove();
    const unread = parseInt(document.getElementById("statUnread").textContent) || 0;
    document.getElementById("statUnread").textContent = Math.max(0, unread - 1);
  } catch (e) {}
}

async function markAllRead() {
  try {
    await AdminApi.post("/notifications/mark-all-read", {});
    loadNotifications(1);
  } catch (e) { alert("Error"); }
}

if (initAdminShell('notifications')) loadNotifications();
</script>
</body>
</html>
