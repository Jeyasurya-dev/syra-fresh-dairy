<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — SYRA Admin</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside id="admin-sidebar"></aside>
  <div class="admin-content">
    <header id="admin-topbar"></header>
    <main class="admin-main">

      <div class="stat-grid" id="stat-grid">
        <div class="skeleton" style="height:90px"></div>
        <div class="skeleton" style="height:90px"></div>
        <div class="skeleton" style="height:90px"></div>
        <div class="skeleton" style="height:90px"></div>
      </div>

      <div class="stat-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="card">
          <div class="section-title-row"><h2>Sales — Last 7 Days</h2></div>
          <div class="bar-chart" id="sales-chart"></div>
        </div>
        <div class="card">
          <div class="section-title-row"><h2>Quick Stats</h2></div>
          <div id="quick-stats"></div>
        </div>
      </div>

      <div class="card" style="margin-top: var(--space-5)">
        <div class="section-title-row">
          <h2>Recent Orders</h2>
          <a href="/admin/orders.html" class="btn btn-outline btn-sm">View All Orders</a>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th></tr></thead>
            <tbody id="recent-orders-body"><tr><td colspan="6"><div class="skeleton" style="height:20px"></div></td></tr></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/admin-api.js"></script>
<script src="js/admin.js"></script>
<script>
function statCardHTML(icon, iconClass, value, label) {
  return `<div class="stat-card"><div class="stat-icon ${iconClass}">${icon}</div><div><strong>${value}</strong><span>${label}</span></div></div>`;
}

function buildBarChart(dailySales) {
  const map = {};
  dailySales.forEach((d) => { map[d._id] = d; });
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const values = days.map((d) => (map[d] ? map[d].revenue : 0));
  const max = Math.max(...values, 1);
  document.getElementById('sales-chart').innerHTML = days.map((d, i) => {
    const height = Math.max(4, Math.round((values[i] / max) * 160));
    const label = new Date(d).toLocaleDateString('en-IN', { weekday: 'short' });
    return `<div class="bar-col">
      <div class="bar" style="height:${height}px" data-value="₹${values[i].toFixed(0)}"></div>
      <span class="bar-label">${label}</span>
    </div>`;
  }).join('');
}

async function loadDashboard() {
  try {
    const data = await AdminApi.get('/admin/dashboard');
    const s = data.stats;
    document.getElementById('stat-grid').innerHTML =
      statCardHTML('🧾', '', data.stats.total_orders, 'Total Orders') +
      statCardHTML('👥', 'accent', data.stats.total_customers, 'Total Customers') +
      statCardHTML('🛒', '', data.stats.total_products, 'Total Products') +
      statCardHTML('💰', 'accent', `₹${data.stats.total_revenue.toLocaleString('en-IN')}`, 'Total Revenue');

    document.getElementById('quick-stats').innerHTML = `
      <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--color-border)">
        <span>⚠️ Low Stock Products</span><strong style="color:#B5680C">${s.low_stock}</strong>
      </div>
      <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--color-border)">
        <span>🚫 Out of Stock</span><strong style="color:var(--color-berry)">${s.out_of_stock}</strong>
      </div>
      <div style="display:flex; justify-content:space-between; padding:10px 0">
        <span>📈 Avg. Order Value</span><strong>₹${s.total_orders ? (s.total_revenue / s.total_orders).toFixed(0) : 0}</strong>
      </div>
      <a href="/admin/inventory.html" class="btn btn-outline btn-sm mt-3" style="width:100%">Manage Inventory →</a>`;

    buildBarChart(data.daily_sales);

    document.getElementById('recent-orders-body').innerHTML = data.recent_orders.length
      ? data.recent_orders.map((o) => `
        <tr>
          <td><a href="/admin/orders.html?highlight=${o.id}" style="font-weight:700; color:var(--color-forest)">#${o.order_number}</a></td>
          <td>${o.address ? o.address.full_name : '—'}</td>
          <td>${o.items.length}</td>
          <td>₹${o.totals.total}</td>
          <td>${statusBadgeHTML(o.status)}</td>
          <td>${formatDate(o.created_at)}</td>
        </tr>`).join('')
      : `<tr><td colspan="6"><div class="empty-state">No orders yet.</div></td></tr>`;
  } catch (e) {
    adminToast(e.message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (initAdminShell('dashboard')) loadDashboard();
});
</script>
</body>
</html>
