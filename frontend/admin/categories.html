<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories — SYRA Admin</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside id="admin-sidebar"></aside>
  <div class="admin-content">
    <header id="admin-topbar"></header>
    <main class="admin-main">

      <div class="admin-toolbar">
        <div style="flex:1"></div>
        <button class="btn btn-primary" onclick="openCategoryForm()">+ Add Category</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Icon</th><th>Name</th><th>Slug</th><th>Subcategories</th><th>Sort</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="categories-body"><tr><td colspan="7"><div class="skeleton" style="height:20px"></div></td></tr></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<div class="modal-overlay" id="category-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="category-modal-title">Add Category</h3>
      <button class="modal-close" onclick="closeModal('category-modal')">✕</button>
    </div>
    <form id="category-form">
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group"><label>Category Name</label><input id="cf-name" required></div>
          <div class="form-group"><label>Icon (emoji)</label><input id="cf-icon" placeholder="🥛" maxlength="4"></div>
        </div>
        <div class="form-group"><label>Subcategories (comma separated)</label><textarea id="cf-subcategories" rows="2" placeholder="Milk, Curd, Paneer, Cheese"></textarea></div>
        <div class="form-group"><label>Sort Order</label><input type="number" id="cf-sort" value="0"></div>
        <label class="form-check"><input type="checkbox" id="cf-active" checked> Active (visible in storefront)</label>
        <div id="category-error" class="form-error mt-3"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal('category-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Category</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin-api.js"></script>
<script src="js/admin.js"></script>
<script>
let categoriesCache = [];
let editingCategoryId = null;

function categoryRowHTML(c) {
  return `
    <tr>
      <td style="font-size:1.4rem">${c.icon || '🛒'}</td>
      <td><strong>${c.name}</strong></td>
      <td><code>${c.slug}</code></td>
      <td><div class="chip-row">${(c.subcategories || []).slice(0, 4).map((s) => `<span class="chip-sm">${s}</span>`).join('')}${c.subcategories && c.subcategories.length > 4 ? `<span class="chip-sm">+${c.subcategories.length - 4}</span>` : ''}</div></td>
      <td>${c.sort_order ?? 0}</td>
      <td>${statusBadgeHTML(c.is_active === false ? 'Inactive' : 'Active')}</td>
      <td>
        <div class="row-actions">
          <button class="btn-icon" title="Edit" onclick='editCategory(${JSON.stringify(c).replace(/'/g, "&apos;")})'>✏️</button>
          <button class="btn-icon danger" title="Delete" onclick="deleteCategory('${c.id}')">🗑️</button>
        </div>
      </td>
    </tr>`;
}

async function loadCategories() {
  const body = document.getElementById('categories-body');
  try {
    // BUG FIX: used to call the public GET /api/categories, which only
    // returns active categories and never included is_active/sort_order.
    // Deactivating a category made it vanish from this page entirely.
    const data = await AdminApi.get('/admin/categories');
    categoriesCache = data.categories || [];
    body.innerHTML = categoriesCache.length ? categoriesCache.map(categoryRowHTML).join('') : `<tr><td colspan="7"><div class="empty-state">No categories yet.</div></td></tr>`;
  } catch (e) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty-state">${e.message}</div></td></tr>`;
  }
}

function openCategoryForm() {
  editingCategoryId = null;
  document.getElementById('category-form').reset();
  document.getElementById('cf-active').checked = true;
  document.getElementById('category-modal-title').textContent = 'Add Category';
  document.getElementById('category-error').textContent = '';
  openModal('category-modal');
}

function editCategory(c) {
  editingCategoryId = c.id;
  document.getElementById('category-modal-title').textContent = 'Edit Category';
  document.getElementById('cf-name').value = c.name;
  document.getElementById('cf-icon').value = c.icon || '';
  document.getElementById('cf-subcategories').value = (c.subcategories || []).join(', ');
  document.getElementById('cf-sort').value = c.sort_order ?? 0;
  document.getElementById('cf-active').checked = c.is_active !== false;
  document.getElementById('category-error').textContent = '';
  openModal('category-modal');
}

document.getElementById('category-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('category-error');
  errEl.textContent = '';
  const payload = {
    name: document.getElementById('cf-name').value.trim(),
    icon: document.getElementById('cf-icon').value.trim(),
    subcategories: document.getElementById('cf-subcategories').value.split(',').map((s) => s.trim()).filter(Boolean),
    sort_order: parseInt(document.getElementById('cf-sort').value, 10) || 0,
    is_active: document.getElementById('cf-active').checked,
  };
  try {
    if (editingCategoryId) {
      await AdminApi.put(`/admin/categories/${editingCategoryId}`, payload);
    } else {
      await AdminApi.post('/admin/categories', payload);
    }
    adminToast('Category saved');
    closeModal('category-modal');
    loadCategories();
  } catch (err) { errEl.textContent = err.message; }
});

async function deleteCategory(id) {
  if (!confirm('Delete this category? Products already assigned to it will be unaffected but no longer filterable by it.')) return;
  try {
    await AdminApi.del(`/admin/categories/${id}`);
    adminToast('Category deleted');
    loadCategories();
  } catch (e) { adminToast(e.message); }
}

document.addEventListener('DOMContentLoaded', () => {
  if (initAdminShell('categories')) loadCategories();
});
</script>
</body>
</html>
