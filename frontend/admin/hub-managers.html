<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub Managers — SYRA Admin</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside id="admin-sidebar"></aside>
  <div class="admin-content">
    <header id="admin-topbar"></header>
    <main class="admin-main">

      <div class="admin-toolbar">
        <input type="text" id="manager-search" placeholder="🔍 Search by name, email, or hub..." oninput="renderManagers()" style="max-width:280px">
        <div style="flex:1"></div>
        <button class="btn btn-primary" onclick="openManagerForm()">+ Create Hub Manager</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Hub</th><th>District</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="managers-body"><tr><td colspan="7"><div class="skeleton" style="height:20px"></div></td></tr></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<div class="modal-overlay" id="manager-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="manager-modal-title">Create Hub Manager</h3>
      <button class="modal-close" onclick="closeModal('manager-modal')">✕</button>
    </div>
    <form id="manager-form">
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input id="mf-name" required></div>
          <div class="form-group"><label>Mobile</label><input id="mf-mobile" required maxlength="10" placeholder="10-digit mobile"></div>
        </div>
        <div class="form-group"><label>Email</label><input type="email" id="mf-email" required></div>
        <div class="form-group" id="mf-password-group"><label>Password</label><input type="password" id="mf-password" placeholder="Min 8 characters, with a letter and a number"></div>
        <div class="form-group">
          <label>Hub</label>
          <select id="mf-hub" required></select>
        </div>
        <div id="manager-error" class="form-error mt-3"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal('manager-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Hub Manager</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin-api.js"></script>
<script src="js/admin.js"></script>
<script>
let hubsCache = [];
let editingManagerId = null;

function managerRowHTML(m) {
  return `
    <tr>
      <td><strong>${escapeHTML(m.name)}</strong></td>
      <td>${m.email}</td>
      <td>${m.mobile || '—'}</td>
      <td>${m.hub_name || '—'}</td>
      <td>${m.district_name || '—'}</td>
      <td>${statusBadgeHTML(m.is_active === false ? 'Disabled' : 'Active')}</td>
      <td>
        <div class="row-actions">
          <button class="btn-icon" title="Edit / Transfer" onclick='editManager(${JSON.stringify(m).replace(/'/g, "&apos;")})'>✏️</button>
          ${m.is_active === false
            ? `<button class="btn-icon" title="Enable" onclick="toggleManager('${m.id}', true)">✅</button>`
            : `<button class="btn-icon" title="Disable" onclick="toggleManager('${m.id}', false)">🚫</button>`}
          <button class="btn-icon danger" title="Delete" onclick="deleteManager('${m.id}')">🗑️</button>
        </div>
      </td>
    </tr>`;
}

async function loadHubsForSelect() {
  try {
    const data = await AdminApi.get('/admin/hubs');
    hubsCache = data.hubs || [];
    document.getElementById('mf-hub').innerHTML = hubsCache.map((h) =>
      `<option value="${h.id}">${h.district_name} — ${h.name}${h.hub_manager ? ' (has a manager)' : ''}</option>`
    ).join('');
  } catch (e) { adminToast(e.message); }
}

let managersCache = [];

async function loadManagers() {
  const body = document.getElementById('managers-body');
  try {
    const data = await AdminApi.get('/admin/hub-managers');
    managersCache = data.hub_managers || [];
    renderManagers();
  } catch (e) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty-state">${e.message}</div></td></tr>`;
  }
}

function renderManagers() {
  const body = document.getElementById('managers-body');
  const q = (document.getElementById('manager-search').value || '').trim().toLowerCase();
  const filtered = q
    ? managersCache.filter((m) => [m.name, m.email, m.hub_name, m.district_name].some((f) => (f || '').toLowerCase().includes(q)))
    : managersCache;
  body.innerHTML = filtered.length
    ? filtered.map(managerRowHTML).join('')
    : `<tr><td colspan="7"><div class="empty-state">${q ? 'No Hub Managers match your search.' : 'No Hub Managers yet. Add hubs first, then create a manager for each one.'}</div></td></tr>`;
  body.classList.add('fade-in');
}

function openManagerForm() {
  if (!hubsCache.length) { adminToast('Add a hub first'); return; }
  editingManagerId = null;
  document.getElementById('manager-form').reset();
  document.getElementById('manager-modal-title').textContent = 'Create Hub Manager';
  document.getElementById('mf-password-group').style.display = '';
  document.getElementById('mf-password').required = true;
  document.getElementById('mf-email').disabled = false;
  document.getElementById('manager-error').textContent = '';
  openModal('manager-modal');
}

function editManager(m) {
  editingManagerId = m.id;
  document.getElementById('manager-modal-title').textContent = 'Edit Hub Manager';
  document.getElementById('mf-name').value = m.name;
  document.getElementById('mf-mobile').value = m.mobile || '';
  document.getElementById('mf-email').value = m.email;
  document.getElementById('mf-email').disabled = true; // email isn't editable after creation
  document.getElementById('mf-hub').value = m.hub_id || '';
  document.getElementById('mf-password-group').style.display = 'none';
  document.getElementById('mf-password').required = false;
  document.getElementById('manager-error').textContent = '';
  openModal('manager-modal');
}

document.getElementById('manager-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('manager-error');
  errEl.textContent = '';
  try {
    if (editingManagerId) {
      await AdminApi.put(`/admin/hub-managers/${editingManagerId}`, {
        name: document.getElementById('mf-name').value.trim(),
        mobile: document.getElementById('mf-mobile').value.trim(),
        hub_id: document.getElementById('mf-hub').value,
      });
    } else {
      await AdminApi.post('/admin/hub-managers', {
        name: document.getElementById('mf-name').value.trim(),
        email: document.getElementById('mf-email').value.trim(),
        mobile: document.getElementById('mf-mobile').value.trim(),
        password: document.getElementById('mf-password').value,
        hub_id: document.getElementById('mf-hub').value,
      });
    }
    adminToast('Hub Manager saved');
    closeModal('manager-modal');
    loadHubsForSelect();
    loadManagers();
  } catch (err) { errEl.textContent = err.message; }
});

async function toggleManager(id, enable) {
  try {
    await AdminApi.post(`/admin/hub-managers/${id}/${enable ? 'enable' : 'disable'}`);
    adminToast(enable ? 'Account enabled' : 'Account disabled');
    loadManagers();
  } catch (e) { adminToast(e.message); }
}

async function deleteManager(id) {
  if (!confirm('Delete this Hub Manager account? This frees up their hub for a new manager.')) return;
  try {
    await AdminApi.del(`/admin/hub-managers/${id}`);
    adminToast('Hub Manager deleted');
    loadHubsForSelect();
    loadManagers();
  } catch (e) { adminToast(e.message); }
}

document.addEventListener('DOMContentLoaded', async () => {
  if (initAdminShell('hub-managers')) {
    await loadHubsForSelect();
    loadManagers();
  }
});
</script>
</body>
</html>
