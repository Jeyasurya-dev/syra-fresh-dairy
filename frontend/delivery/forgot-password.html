<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SYRA Fresh Delivery</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px;
            background: var(--color-surface);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            font-size: 28px;
            color: var(--color-forest);
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: var(--color-ink-soft);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-ink);
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-surface-alt);
            color: var(--color-ink);
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--color-forest);
            box-shadow: 0 0 0 3px var(--color-leaf-light);
        }
        
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .success-message {
            color: #28a745;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--color-forest);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-bottom: 15px;
        }
        
        .btn-submit:hover {
            background: var(--color-forest-dark);
        }
        
        .btn-submit:disabled {
            background: var(--color-border);
            cursor: not-allowed;
        }
        
        .auth-links {
            text-align: center;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .auth-links a {
            color: var(--color-forest);
            text-decoration: none;
            font-size: 14px;
        }
        
        .auth-links a:hover {
            text-decoration: underline;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid var(--color-forest);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🚚 SYRA Fresh</h1>
            <p>Forgot Password</p>
        </div>
        
        <div class="info-box">
            Enter your email or mobile number to receive password reset instructions.
        </div>
        
        <div id="message" style="display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;"></div>
        
        <form id="forgotForm">
            <div class="form-group">
                <label for="identifier">Email or Mobile Number</label>
                <input type="text" id="identifier" name="identifier" placeholder="Enter email or 10-digit mobile" required>
                <div class="error-message" id="identifierError"></div>
            </div>
            
            <button type="submit" class="btn-submit" id="submitBtn">Send Reset Link</button>
        </form>
        
        <div class="auth-links">
            <a href="login.html">Back to Login</a>
            <a href="register.html">Register</a>
            <a href="../index.html">Back to Home</a>
        </div>
    </div>
    
    <script>
        const API_URL = "https://syra-fresh-backend.onrender.com/api/delivery";
        
        document.getElementById("forgotForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById("identifier").value.trim();
            const submitBtn = document.getElementById("submitBtn");
            const messageDiv = document.getElementById("message");
            
            document.getElementById("identifierError").textContent = "";
            messageDiv.style.display = "none";
            
            if (!identifier) {
                document.getElementById("identifierError").textContent = "Please enter email or mobile";
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = "Sending...";
            
            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ email: identifier })
                });
                
                const data = await response.json();
                
                messageDiv.style.display = "block";
                if (data.success) {
                    messageDiv.style.backgroundColor = "#d4edda";
                    messageDiv.style.color = "#155724";
                    messageDiv.style.borderLeft = "4px solid #28a745";
                    messageDiv.textContent = data.message || "If account exists, reset link has been sent to your email";
                    document.getElementById("forgotForm").reset();
                } else {
                    messageDiv.style.backgroundColor = "#f8d7da";
                    messageDiv.style.color = "#721c24";
                    messageDiv.style.borderLeft = "4px solid #dc3545";
                    messageDiv.textContent = data.message || "Request failed";
                }
            } catch (error) {
                console.error("Error:", error);
                messageDiv.style.display = "block";
                messageDiv.style.backgroundColor = "#f8d7da";
                messageDiv.style.color = "#721c24";
                messageDiv.style.borderLeft = "4px solid #dc3545";
                messageDiv.textContent = "Network error. Please try again.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
