<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - SYRA Fresh</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--color-forest);
            text-decoration: none;
            margin-bottom: 20px;
        }
        
        .order-header {
            background: var(--color-surface);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        
        .order-number {
            font-size: 24px;
            font-weight: bold;
            color: var(--color-ink);
            margin-bottom: 10px;
        }
        
        .status-timeline {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            overflow-x: auto;
            padding: 10px 0;
        }
        
        .timeline-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }
        
        .timeline-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--color-border);
            border: 3px solid var(--color-surface);
            margin-bottom: 10px;
        }
        
        .timeline-dot.active {
            background: var(--color-forest);
        }
        
        .timeline-label {
            font-size: 12px;
            text-align: center;
            color: var(--color-ink-soft);
        }
        
        .customer-section,
        .delivery-section,
        .items-section {
            background: var(--color-surface);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-ink);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
        }
        
        .info-label {
            color: var(--color-ink-soft);
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-weight: 600;
            color: var(--color-ink);
        }
        
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .item-card {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: var(--color-bg);
            border-radius: 8px;
        }
        
        .item-name {
            flex: 1;
            font-weight: 600;
        }
        
        .item-qty {
            color: var(--color-ink-soft);
            font-size: 14px;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: var(--color-forest);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--color-forest-dark);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--color-forest);
            border: 2px solid var(--color-forest);
        }
        
        .btn-secondary:hover {
            background: var(--color-forest);
            color: white;
        }
        
        .map-placeholder {
            width: 100%;
            height: 300px;
            background: var(--color-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-ink-soft);
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="assignments.html" class="back-link">← Back to Assignments</a>
        
        <div class="order-header">
            <div class="order-number" id="orderNumber">Loading...</div>
            <div style="color: var(--color-ink-soft); margin-bottom: 15px;">
                <span id="orderStatus">Status: Loading</span>
            </div>
            <div class="status-timeline" id="timeline"></div>
        </div>
        
        <div class="customer-section">
            <div class="section-title">👤 Customer Information</div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Name</span>
                    <span class="info-value" id="customerName">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Phone</span>
                    <span class="info-value" id="customerPhone">-</span>
                </div>
            </div>
        </div>
        
        <div class="delivery-section">
            <div class="section-title">📍 Delivery Address</div>
            <div class="info-item">
                <span class="info-value" id="deliveryAddress">-</span>
            </div>
            <div class="map-placeholder">
                🗺️ Map integration (future feature)
            </div>
        </div>
        
        <div class="items-section">
            <div class="section-title">📦 Order Items</div>
            <div class="item-list" id="itemsList"></div>
        </div>
        
        <div class="delivery-section">
            <div class="section-title">💳 Payment Information</div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Payment Method</span>
                    <span class="info-value" id="paymentMethod">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Order Total</span>
                    <span class="info-value" id="orderTotal">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">COD Amount (if applicable)</span>
                    <span class="info-value" id="codAmount">-</span>
                </div>
            </div>
        </div>
        
        <div class="actions" id="actions"></div>
    </div>
    
    <script src="delivery-shared.js"></script>
    <script>
        const API_URL = "https://syra-fresh-backend.onrender.com/api/delivery";
        
        function getAssignmentIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('assignment_id');
        }
        
        async function loadOrderDetails() {
            const token = localStorage.getItem("delivery_token");
            const assignmentId = getAssignmentIdFromUrl();
            
            if (!assignmentId) {
                alert("Invalid assignment ID");
                window.location.href = "assignments.html";
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/assignments/${assignmentId}`, {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error("Failed to load order");
                }
                
                const data = await response.json();
                
                if (data.success) {
                    renderOrderDetails(data.assignment);
                }
            } catch (error) {
                console.error("Error loading order:", error);
                alert("Failed to load order details");
            }
        }
        
        function renderOrderDetails(assignment) {
            document.getElementById("orderNumber").textContent = `Order #${assignment.order_number}`;
            document.getElementById("orderStatus").textContent = `Status: ${assignment.status.replace(/_/g, ' ').toUpperCase()}`;
            
            document.getElementById("customerName").textContent = assignment.customer.name;
            document.getElementById("customerPhone").textContent = assignment.customer.phone;
            
            const address = assignment.delivery_address;
            const addressStr = `${address?.line1}, ${address?.line2 ? address.line2 + ', ' : ''}${address?.city}, ${address?.state} ${address?.pincode}`;
            document.getElementById("deliveryAddress").textContent = addressStr;
            
            document.getElementById("paymentMethod").textContent = assignment.payment_method?.toUpperCase() || 'N/A';
            document.getElementById("orderTotal").textContent = `₹${assignment.order_items?.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2) || '0'}`;
            document.getElementById("codAmount").textContent = `₹${assignment.cod_collected.toFixed(2)}`;
            
            // Render items
            let itemsHtml = '';
            assignment.order_items?.forEach(item => {
                itemsHtml += `
                    <div class="item-card">
                        <div class="item-name">${item.name}</div>
                        <div class="item-qty">${item.quantity} × ${item.unit}</div>
                        <div style="font-weight: 600;">₹${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                `;
            });
            document.getElementById("itemsList").innerHTML = itemsHtml;
            
            // Render timeline
            renderTimeline(assignment.status);
            
            // Render actions
            renderActions(assignment);
        }
        
        function renderTimeline(status) {
            const statuses = ['assigned', 'picked_up', 'out_for_delivery', 'delivered'];
            const currentIndex = statuses.indexOf(status);
            
            let html = '';
            statuses.forEach((s, index) => {
                html += `
                    <div class="timeline-item">
                        <div class="timeline-dot ${index <= currentIndex ? 'active' : ''}"></div>
                        <div class="timeline-label">${s.replace(/_/g, ' ')}</div>
                    </div>
                `;
            });
            
            document.getElementById("timeline").innerHTML = html;
        }
        
        function renderActions(assignment) {
            const assignmentId = assignment.assignment_id;
            let html = '';
            
            if (assignment.status === 'assigned') {
                html = `<button class="btn btn-primary" onclick="updateStatus('${assignmentId}', 'picked_up')">Mark as Picked Up</button>`;
            } else if (assignment.status === 'picked_up') {
                html = `<button class="btn btn-primary" onclick="updateStatus('${assignmentId}', 'out_for_delivery')">Mark Out For Delivery</button>`;
            } else if (assignment.status === 'out_for_delivery') {
                html = `<button class="btn btn-primary" onclick="updateStatus('${assignmentId}', 'delivered')">Mark as Delivered</button>`;
                html += `<button class="btn btn-secondary" onclick="markFailed('${assignmentId}')">Report Issue</button>`;
            }
            
            html += `<a href="assignments.html" class="btn btn-secondary">Back</a>`;
            document.getElementById("actions").innerHTML = html;
        }
        
        async function updateStatus(assignmentId, newStatus) {
            const token = localStorage.getItem("delivery_token");
            
            try {
                const response = await fetch(`${API_URL}/assignments/${assignmentId}/status`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(data.message);
                    loadOrderDetails();
                } else {
                    alert(data.message || "Failed to update");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error updating order");
            }
        }
        
        function markFailed(assignmentId) {
            const reason = prompt("Please provide reason for failed delivery:");
            if (reason) {
                updateStatus(assignmentId, 'failed');
            }
        }
        
        loadOrderDetails();
    </script>
</body>
</html>
