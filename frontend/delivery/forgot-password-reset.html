<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SYRA Fresh Delivery</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px;
            background: var(--color-surface);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            font-size: 28px;
            color: var(--color-forest);
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: var(--color-ink-soft);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-ink);
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-surface-alt);
            color: var(--color-ink);
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--color-forest);
            box-shadow: 0 0 0 3px var(--color-leaf-light);
        }
        
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--color-forest);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-bottom: 15px;
        }
        
        .btn-submit:hover {
            background: var(--color-forest-dark);
        }
        
        .btn-submit:disabled {
            background: var(--color-border);
            cursor: not-allowed;
        }
        
        .auth-links {
            text-align: center;
        }
        
        .auth-links a {
            color: var(--color-forest);
            text-decoration: none;
            font-size: 14px;
        }
        
        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🚚 SYRA Fresh</h1>
            <p>Reset Password</p>
        </div>
        
        <div id="message" style="display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;"></div>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="new_password" placeholder="Minimum 6 characters" required>
                <div class="error-message" id="newPasswordError"></div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirm_password" placeholder="Re-enter password" required>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>
            
            <button type="submit" class="btn-submit" id="submitBtn">Reset Password</button>
        </form>
        
        <div class="auth-links">
            <a href="login.html">Back to Login</a>
        </div>
    </div>
    
    <script>
        const API_URL = "http://localhost:5000/api/delivery";
        
        function getTokenFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }
        
        document.getElementById("resetForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const token = getTokenFromUrl();
            if (!token) {
                alert("Invalid reset link");
                window.location.href = "forgot-password.html";
                return;
            }
            
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const submitBtn = document.getElementById("submitBtn");
            const messageDiv = document.getElementById("message");
            
            document.getElementById("newPasswordError").textContent = "";
            document.getElementById("confirmPasswordError").textContent = "";
            messageDiv.style.display = "none";
            
            if (newPassword.length < 6) {
                document.getElementById("newPasswordError").textContent = "Password must be at least 6 characters";
                return;
            }
            
            if (newPassword !== confirmPassword) {
                document.getElementById("confirmPasswordError").textContent = "Passwords do not match";
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = "Resetting...";
            
            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });
                
                const data = await response.json();
                
                messageDiv.style.display = "block";
                if (data.success) {
                    messageDiv.style.backgroundColor = "#d4edda";
                    messageDiv.style.color = "#155724";
                    messageDiv.style.borderLeft = "4px solid #28a745";
                    messageDiv.textContent = "Password reset successful. Redirecting to login...";
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                } else {
                    messageDiv.style.backgroundColor = "#f8d7da";
                    messageDiv.style.color = "#721c24";
                    messageDiv.style.borderLeft = "4px solid #dc3545";
                    messageDiv.textContent = data.message || "Failed to reset password";
                }
            } catch (error) {
                console.error("Error:", error);
                messageDiv.style.display = "block";
                messageDiv.style.backgroundColor = "#f8d7da";
                messageDiv.style.color = "#721c24";
                messageDiv.style.borderLeft = "4px solid #dc3545";
                messageDiv.textContent = "Network error. Please try again.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Reset Password";
            }
        });
    </script>
</body>
</html>
