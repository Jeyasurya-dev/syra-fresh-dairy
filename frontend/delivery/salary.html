<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary - SYRA Fresh Delivery</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        body { background: var(--color-bg); color: var(--color-ink); padding-bottom: 80px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 5px; color: var(--color-forest); text-decoration: none; margin-bottom: 20px; font-size: 14px; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        .slip-card { background: var(--color-surface); padding: 18px; border-radius: 12px; box-shadow: var(--shadow-sm); margin-bottom: 14px; display:flex; justify-content:space-between; align-items:center; gap: 10px; flex-wrap: wrap; }
        .slip-month { font-weight: 700; font-size: 16px; }
        .slip-slipno { font-size: 12px; color: var(--color-ink-soft); }
        .slip-net { font-size: 20px; font-weight: 700; color: var(--color-forest); }
        .status-paid { display:inline-block; padding:4px 10px; background:#d4edda; color:#155724; border-radius:20px; font-size:12px; font-weight:600; }
        .status-pending { display:inline-block; padding:4px 10px; background:#fff3cd; color:#856404; border-radius:20px; font-size:12px; font-weight:600; }
        .btn-view-slip { padding: 8px 14px; background: var(--color-forest); color:#fff; border:none; border-radius:8px; font-size:13px; cursor:pointer; text-decoration:none; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--color-ink-soft); background: var(--color-surface); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        <div class="page-title">🧾 My Salary</div>
        <p style="color:var(--color-ink-soft); font-size:13px; margin-top:-14px; margin-bottom: 20px;">
            Monthly salary slips generated by your Hub / Super Admin, including incentives, fuel allowance,
            bonuses, and any attendance-based deductions. This is separate from your day-to-day
            <a href="earnings.html">Earnings</a> (COD tracking).
        </p>

        <div id="slipsContainer">
            <div style="text-align:center;padding:30px;color:var(--color-ink-soft);">Loading...</div>
        </div>
    </div>

    <script src="delivery-shared.js"></script>
    <script>
        const API_URL = "http://localhost:5000/api/delivery";

        async function loadSalary() {
            const token = localStorage.getItem("delivery_token");
            if (!token) { window.location.href = "login.html"; return; }
            const container = document.getElementById("slipsContainer");

            try {
                const res = await fetch(`${API_URL}/salary`, { headers: { Authorization: `Bearer ${token}` } });
                const data = await res.json();
                if (!data.success || !data.transactions.length) {
                    container.innerHTML = `<div class="empty-state">No salary slips yet. Your Hub Manager or Super Admin generates these once a month.</div>`;
                    return;
                }
                container.innerHTML = data.transactions.map((t) => `
                    <div class="slip-card">
                        <div>
                            <div class="slip-month">${t.month}</div>
                            <div class="slip-slipno">Slip #${t.slip_number}</div>
                        </div>
                        <div><span class="${t.status === 'paid' ? 'status-paid' : 'status-pending'}">${t.status === 'paid' ? 'Paid' : 'Pending'}</span></div>
                        <div class="slip-net">₹${t.net_pay.toFixed(2)}</div>
                        <div style="display:flex; gap:8px;">
                            <a class="btn-view-slip" href="../admin/salary-slip.html?id=${t.id}" target="_blank">View Slip</a>
                            <button class="btn-view-slip" style="border:none;cursor:pointer;" onclick="downloadSlipPdf('${t.id}', '${t.slip_number}')">⬇️ PDF</button>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                container.innerHTML = `<div class="empty-state">Could not load your salary history.</div>`;
            }
        }

        renderDeliveryNav('salary.html');
        loadSalary();

        async function downloadSlipPdf(id, slipNumber) {
            const token = localStorage.getItem("delivery_token");
            try {
                const res = await fetch(`${API_URL}/salary/${id}/pdf`, { headers: { Authorization: `Bearer ${token}` } });
                if (!res.ok) throw new Error("Could not generate the PDF");
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `salary-slip-${slipNumber}.pdf`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                showDeliveryToast(err.message, "error");
            }
        }
    </script>
</body>
</html>
