<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Dashboard - SYRA Fresh</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
        }
        
        .dashboard-header h1 {
            font-size: 24px;
            color: var(--color-ink);
        }
        
        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .online-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: var(--color-forest);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            background: var(--color-bg);
        }
        
        .stat-card {
            background: var(--color-surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--color-forest);
        }
        
        .stat-card h3 {
            font-size: 12px;
            color: var(--color-ink-soft);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: var(--color-ink);
        }
        
        .stat-card.warning {
            border-left-color: #ffc107;
        }
        
        .stat-card.success {
            border-left-color: #28a745;
        }
        
        .stat-card.danger {
            border-left-color: #dc3545;
        }
        
        .content-section {
            padding: 20px;
            background: var(--color-bg);
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-ink);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .assignments-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--color-surface);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .assignments-table th {
            background: var(--color-surface);
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--color-ink);
            border-bottom: 2px solid var(--color-border);
        }
        
        .assignments-table td {
            padding: 15px;
            border-bottom: 1px solid var(--color-border);
            color: var(--color-ink);
        }
        
        .assignments-table tr:last-child td {
            border-bottom: none;
        }
        
        .order-number {
            font-weight: 600;
            color: var(--color-forest);
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-assigned {
            background: #e7f3ff;
            color: #0066cc;
        }
        
        .status-out {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-delivered {
            background: #d4edda;
            color: #155724;
        }
        
        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .action-btn {
            padding: 8px 16px;
            background: var(--color-forest);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
        }
        
        .action-btn:hover {
            background: var(--color-forest-dark);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--color-ink-soft);
        }
        
        .empty-state p {
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .nav-bottom {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: var(--color-surface);
            border-top: 1px solid var(--color-border);
            flex-wrap: wrap;
        }
        
        .nav-btn {
            flex: 1;
            padding: 12px;
            background: var(--color-forest);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        
        .nav-btn:hover {
            background: var(--color-forest-dark);
        }
        
        .nav-btn.secondary {
            background: transparent;
            color: var(--color-forest);
            border: 2px solid var(--color-forest);
        }
        
        .nav-btn.secondary:hover {
            background: var(--color-forest);
            color: white;
        }
        
        .message {
            padding: 12px 20px;
            margin: 20px;
            border-radius: 8px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .assignments-table {
                font-size: 12px;
            }
            
            .assignments-table th,
            .assignments-table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <div>
            <h1>🚚 Delivery Dashboard</h1>
            <p id="userGreeting" style="color: var(--color-ink-soft); margin-top: 5px;"></p>
        </div>
        <div class="header-actions">
            <div class="online-toggle">
                <label for="onlineToggle">Online</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="onlineToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <button onclick="logout()" style="padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer;">Logout</button>
        </div>
    </div>
    
    <div id="message" class="message" style="display: none;"></div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Assigned Orders</h3>
            <div class="value" id="assignedCount">0</div>
        </div>
        <div class="stat-card warning">
            <h3>Out For Delivery</h3>
            <div class="value" id="outCount">0</div>
        </div>
        <div class="stat-card success">
            <h3>Delivered Today</h3>
            <div class="value" id="deliveredCount">0</div>
        </div>
        <div class="stat-card">
            <h3>COD Pending</h3>
            <div class="value" id="codCount">₹0</div>
        </div>
    </div>
    
    <div class="content-section">
        <div class="section-title">📦 Your Assignments</div>
        
        <div id="assignmentsContainer">
            <div class="empty-state">
                <p>No assignments yet</p>
                <p style="font-size: 12px;">Check back soon for new orders</p>
            </div>
        </div>
    </div>
    
    <div class="nav-bottom">
        <button onclick="window.location.href='assignments.html'" class="nav-btn">View All Assignments</button>
        <button onclick="window.location.href='history.html'" class="nav-btn secondary">Delivery History</button>
        <button onclick="window.location.href='profile.html'" class="nav-btn secondary">My Profile</button>
    </div>
    
    <script src="delivery-shared.js"></script>
    <script>
        const API_URL = "http://localhost:5000/api/delivery";
        
        async function checkAuth() {
            const token = localStorage.getItem("delivery_token");
            if (!token) {
                window.location.href = "login.html";
                return;
            }
            return token;
        }
        
        async function loadDashboard() {
            const token = await checkAuth();
            
            try {
                const response = await fetch(`${API_URL}/dashboard`, {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.clear();
                        window.location.href = "login.html";
                    }
                    return;
                }
                
                const data = await response.json();
                
                if (data.success) {
                    const dashboard = data.dashboard;
                    document.getElementById("assignedCount").textContent = dashboard.assigned_orders;
                    document.getElementById("outCount").textContent = dashboard.out_for_delivery;
                    document.getElementById("deliveredCount").textContent = dashboard.delivered_today;
                    document.getElementById("codCount").textContent = `₹${dashboard.cod_pending.toFixed(2)}`;
                    
                    // Set online toggle
                    document.getElementById("onlineToggle").checked = dashboard.is_online;
                    
                    // Load recent assignments
                    loadRecentAssignments(token);
                }
            } catch (error) {
                console.error("Error loading dashboard:", error);
            }
        }
        
        async function loadRecentAssignments(token) {
            try {
                const response = await fetch(`${API_URL}/assignments?limit=5`, {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success && data.assignments.length > 0) {
                    let html = `
                        <table class="assignments-table">
                            <thead>
                                <tr>
                                    <th>Order</th>
                                    <th>Customer</th>
                                    <th>Status</th>
                                    <th>COD</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    data.assignments.forEach(assignment => {
                        const statusClass = `status-${assignment.status.toLowerCase().replace(/_/g, '')}`;
                        html += `
                            <tr>
                                <td><span class="order-number">${assignment.order_number}</span></td>
                                <td>${assignment.customer_name}<br><small>${assignment.customer_phone}</small></td>
                                <td><span class="status-badge ${statusClass}">${assignment.status}</span></td>
                                <td>₹${assignment.cod_collected.toFixed(2)}</td>
                                <td><a href="order-details.html?assignment_id=${assignment.assignment_id}" class="action-btn">Details</a></td>
                            </tr>
                        `;
                    });
                    
                    html += `</tbody></table>`;
                    document.getElementById("assignmentsContainer").innerHTML = html;
                }
            } catch (error) {
                console.error("Error loading assignments:", error);
            }
        }
        
        // Online toggle
        document.getElementById("onlineToggle").addEventListener("change", async (e) => {
            const token = localStorage.getItem("delivery_token");
            const isOnline = e.target.checked;
            
            try {
                const response = await fetch(`${API_URL}/toggle-online`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ is_online: isOnline })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const message = document.getElementById("message");
                    message.textContent = data.message;
                    message.style.display = "block";
                    setTimeout(() => {
                        message.style.display = "none";
                    }, 2000);
                }
            } catch (error) {
                console.error("Error toggling online status:", error);
                e.target.checked = !isOnline;
            }
        });
        
        // Set user greeting
        const user = JSON.parse(localStorage.getItem("delivery_user") || "{}");
        document.getElementById("userGreeting").textContent = `Welcome back, ${user.name}!`;
        
        // Load dashboard on page load
        renderDeliveryNav('dashboard.html');
        loadDashboard();
        
        function logout() {
            if (confirm("Are you sure you want to logout?")) {
                localStorage.clear();
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
